name: Prepare Windows and Linux update
on:
  repository_dispatch:
    types: [prepare-windows-linux-update]
permissions:
  contents: write
concurrency:
  group: prepare-${{ github.event.client_payload.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - name: Verify transferred release bytes and prepare a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare-update.py
